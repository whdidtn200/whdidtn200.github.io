name: Manual Publish Probe

on:
  push:
    paths:
      - ".github/workflows/manual-publish-probe.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run publish pipeline
        env:
          GIT_AUTHOR_NAME: malt-bot
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
        run: bash scripts/run_daily_publish.sh
