name: Daily arXiv Publish

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run daily pipeline
        run: python3 scripts/arxiv_pipeline.py

      - name: Commit changes
        run: |
          git config user.name "malt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/archive posts posts.html index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "MALT daily arXiv publish"
          git push
