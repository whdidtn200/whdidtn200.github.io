name: Weekly Testing Lab Publish

on:
  # Manual only until this pipeline runs a real reproducible experiment.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run weekly lab pipeline
        env:
          GIT_AUTHOR_NAME: malt-bot
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
        run: bash scripts/run_weekly_lab_publish.sh
