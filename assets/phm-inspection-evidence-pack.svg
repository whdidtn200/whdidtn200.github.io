<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">PHM inspection evidence pack</title>
  <desc id="desc">Six elements of an inspection evidence pack: trigger, context, signal, field proof, action, and closure.</desc>
  <rect width="1180" height="760" rx="28" fill="#f5f7f4"/>
  <text x="70" y="74" font-family="Avenir Next, sans-serif" font-size="34" font-weight="700" fill="#102b39">PHM inspection evidence pack</text>
  <text x="70" y="110" font-family="Avenir Next, sans-serif" font-size="18" fill="#546b61">What a field-ready ticket should keep together from first alert to closure</text>
  <rect x="80" y="160" width="300" height="160" rx="22" fill="#ffffff" stroke="#d5ddd8"/>
  <text x="110" y="205" font-family="Avenir Next, sans-serif" font-size="24" font-weight="700" fill="#0d6a72">1. Trigger snapshot</text>
  <text x="110" y="242" font-family="Avenir Next, sans-serif" font-size="17" fill="#405b63">score, threshold, severity,</text>
  <text x="110" y="268" font-family="Avenir Next, sans-serif" font-size="17" fill="#405b63">persistence, alert time</text>
  <rect x="440" y="160" width="300" height="160" rx="22" fill="#ffffff" stroke="#d5ddd8"/>
  <text x="470" y="205" font-family="Avenir Next, sans-serif" font-size="24" font-weight="700" fill="#0d6a72">2. Context snapshot</text>
  <text x="470" y="242" font-family="Avenir Next, sans-serif" font-size="17" fill="#405b63">speed, load, mode,</text>
  <text x="470" y="268" font-family="Avenir Next, sans-serif" font-size="17" fill="#405b63">maintenance state, sensor health</text>
  <rect x="800" y="160" width="300" height="160" rx="22" fill="#ffffff" stroke="#d5ddd8"/>
  <text x="830" y="205" font-family="Avenir Next, sans-serif" font-size="24" font-weight="700" fill="#0d6a72">3. Signal excerpt</text>
  <text x="830" y="242" font-family="Avenir Next, sans-serif" font-size="17" fill="#405b63">waveform, spectrum, trend,</text>
  <text x="830" y="268" font-family="Avenir Next, sans-serif" font-size="17" fill="#405b63">baseline comparison</text>
  <rect x="80" y="390" width="300" height="160" rx="22" fill="#ffffff" stroke="#d5ddd8"/>
  <text x="110" y="435" font-family="Avenir Next, sans-serif" font-size="24" font-weight="700" fill="#d47a3b">4. Field proof</text>
  <text x="110" y="472" font-family="Avenir Next, sans-serif" font-size="17" fill="#405b63">photos, notes, smell, sound,</text>
  <text x="110" y="498" font-family="Avenir Next, sans-serif" font-size="17" fill="#405b63">visible wear or looseness</text>
  <rect x="440" y="390" width="300" height="160" rx="22" fill="#ffffff" stroke="#d5ddd8"/>
  <text x="470" y="435" font-family="Avenir Next, sans-serif" font-size="24" font-weight="700" fill="#d47a3b">5. Action record</text>
  <text x="470" y="472" font-family="Avenir Next, sans-serif" font-size="17" fill="#405b63">inspection ticket, part change,</text>
  <text x="470" y="498" font-family="Avenir Next, sans-serif" font-size="17" fill="#405b63">restriction, restart criteria</text>
  <rect x="800" y="390" width="300" height="160" rx="22" fill="#ffffff" stroke="#d5ddd8"/>
  <text x="830" y="435" font-family="Avenir Next, sans-serif" font-size="24" font-weight="700" fill="#d47a3b">6. Closure label</text>
  <text x="830" y="472" font-family="Avenir Next, sans-serif" font-size="17" fill="#405b63">true positive, false positive,</text>
  <text x="830" y="498" font-family="Avenir Next, sans-serif" font-size="17" fill="#405b63">inconclusive, sensor issue</text>
  <line x1="230" y1="320" x2="230" y2="390" stroke="#b7c7c1" stroke-width="6" stroke-linecap="round"/>
  <line x1="590" y1="320" x2="590" y2="390" stroke="#b7c7c1" stroke-width="6" stroke-linecap="round"/>
  <line x1="950" y1="320" x2="950" y2="390" stroke="#b7c7c1" stroke-width="6" stroke-linecap="round"/>
  <path d="M 590 600 C 590 650, 480 676, 360 676" fill="none" stroke="#8aa19a" stroke-width="6" stroke-linecap="round"/>
  <path d="M 590 600 C 590 650, 700 676, 820 676" fill="none" stroke="#8aa19a" stroke-width="6" stroke-linecap="round"/>
  <text x="490" y="724" font-family="Avenir Next, sans-serif" font-size="18" font-weight="700" fill="#102b39">Records must flow back into threshold, sensor-health, and model review.</text>
</svg>
