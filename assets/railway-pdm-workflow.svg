<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Railway predictive maintenance workflow</title>
  <desc id="desc">A MALT original diagram showing sensing, context, diagnosis, prioritization, and maintenance action flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5fbfc"/>
      <stop offset="100%" stop-color="#eef5fb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b8b95"/>
      <stop offset="100%" stop-color="#1f5fd6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#163654" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a4d68"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="72" y="92" fill="#10253a" font-family="Arial, sans-serif" font-size="42" font-weight="700">Railway Predictive Maintenance Workflow</text>
  <text x="72" y="128" fill="#54697f" font-family="Arial, sans-serif" font-size="22">MALT original diagram: from sensing to maintenance action</text>

  <rect x="72" y="180" rx="24" ry="24" width="230" height="168" fill="#ffffff" stroke="#c4d7e5" filter="url(#shadow)"/>
  <text x="104" y="228" fill="#0d1a28" font-family="Arial, sans-serif" font-size="24" font-weight="700">1. Sensing</text>
  <text x="104" y="266" fill="#54697f" font-family="Arial, sans-serif" font-size="20">Vibration</text>
  <text x="104" y="296" fill="#54697f" font-family="Arial, sans-serif" font-size="20">AE / Temperature</text>
  <text x="104" y="326" fill="#54697f" font-family="Arial, sans-serif" font-size="20">Wayside signals</text>

  <rect x="354" y="180" rx="24" ry="24" width="230" height="168" fill="#ffffff" stroke="#c4d7e5" filter="url(#shadow)"/>
  <text x="386" y="228" fill="#0d1a28" font-family="Arial, sans-serif" font-size="24" font-weight="700">2. Context</text>
  <text x="386" y="266" fill="#54697f" font-family="Arial, sans-serif" font-size="20">Speed / Load</text>
  <text x="386" y="296" fill="#54697f" font-family="Arial, sans-serif" font-size="20">Route / Season</text>
  <text x="386" y="326" fill="#54697f" font-family="Arial, sans-serif" font-size="20">Maintenance history</text>

  <rect x="636" y="180" rx="24" ry="24" width="230" height="168" fill="#ffffff" stroke="#c4d7e5" filter="url(#shadow)"/>
  <text x="668" y="228" fill="#0d1a28" font-family="Arial, sans-serif" font-size="24" font-weight="700">3. Diagnosis</text>
  <text x="668" y="266" fill="#54697f" font-family="Arial, sans-serif" font-size="20">Anomaly scoring</text>
  <text x="668" y="296" fill="#54697f" font-family="Arial, sans-serif" font-size="20">Fault mode review</text>
  <text x="668" y="326" fill="#54697f" font-family="Arial, sans-serif" font-size="20">Lead time estimate</text>

  <rect x="918" y="180" rx="24" ry="24" width="210" height="168" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="948" y="228" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">4. Action</text>
  <text x="948" y="266" fill="#eaf7fb" font-family="Arial, sans-serif" font-size="20">Inspection queue</text>
  <text x="948" y="296" fill="#eaf7fb" font-family="Arial, sans-serif" font-size="20">Work order</text>
  <text x="948" y="326" fill="#eaf7fb" font-family="Arial, sans-serif" font-size="20">Planned intervention</text>

  <path d="M 302 264 C 330 264, 330 264, 354 264" stroke="#2a4d68" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 584 264 C 612 264, 612 264, 636 264" stroke="#2a4d68" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 866 264 C 892 264, 892 264, 918 264" stroke="#2a4d68" stroke-width="6" fill="none" marker-end="url(#arrow)"/>

  <rect x="108" y="432" rx="28" ry="28" width="984" height="180" fill="#ffffff" stroke="#d3e0e9" filter="url(#shadow)"/>
  <text x="148" y="484" fill="#10253a" font-family="Arial, sans-serif" font-size="28" font-weight="700">What makes value visible?</text>
  <text x="148" y="532" fill="#54697f" font-family="Arial, sans-serif" font-size="22">• Detection lead time before service impact</text>
  <text x="148" y="566" fill="#54697f" font-family="Arial, sans-serif" font-size="22">• False alarm burden that operators can tolerate</text>
  <text x="148" y="600" fill="#54697f" font-family="Arial, sans-serif" font-size="22">• Work order conversion from alert to action</text>
  <text x="710" y="532" fill="#54697f" font-family="Arial, sans-serif" font-size="22">• Downtime avoided and maintenance efficiency</text>
  <text x="710" y="566" fill="#54697f" font-family="Arial, sans-serif" font-size="22">• Feedback loop back into model and rule tuning</text>
</svg>
