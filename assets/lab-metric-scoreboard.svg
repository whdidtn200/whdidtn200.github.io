<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Lab Metric Scoreboard</title>
  <desc id="desc">Original chart showing balanced evaluation categories for an experiment lab article.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fbfd"/>
      <stop offset="100%" stop-color="#eef5fb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <text x="88" y="92" font-size="38" font-weight="800" fill="#10253a">Balanced Experiment Scoreboard</text>
  <text x="88" y="130" font-size="21" fill="#54697f">Experimental value is more than a single accuracy number.</text>

  <g stroke="#caddea" stroke-width="2">
    <line x1="170" y1="560" x2="1050" y2="560"/>
    <line x1="170" y1="520" x2="1050" y2="520"/>
    <line x1="170" y1="480" x2="1050" y2="480"/>
    <line x1="170" y1="440" x2="1050" y2="440"/>
    <line x1="170" y1="400" x2="1050" y2="400"/>
    <line x1="170" y1="360" x2="1050" y2="360"/>
    <line x1="170" y1="320" x2="1050" y2="320"/>
    <line x1="170" y1="280" x2="1050" y2="280"/>
  </g>

  <g font-size="16" fill="#5f738a">
    <text x="126" y="565">0</text>
    <text x="118" y="525">10</text>
    <text x="118" y="485">20</text>
    <text x="118" y="445">30</text>
    <text x="118" y="405">40</text>
    <text x="118" y="365">50</text>
    <text x="118" y="325">60</text>
    <text x="118" y="285">70</text>
  </g>

  <g>
    <rect x="220" y="360" width="110" height="200" rx="18" fill="#0b8b95"/>
    <rect x="390" y="260" width="110" height="300" rx="18" fill="#15879f"/>
    <rect x="560" y="300" width="110" height="260" rx="18" fill="#1b7daa"/>
    <rect x="730" y="220" width="110" height="340" rx="18" fill="#246fc0"/>
    <rect x="900" y="340" width="110" height="220" rx="18" fill="#4e7ed0"/>
  </g>

  <g font-size="20" font-weight="700" fill="#10253a" text-anchor="middle">
    <text x="275" y="602">Raw Accuracy</text>
    <text x="445" y="602">Generalization</text>
    <text x="615" y="602">Reproducibility</text>
    <text x="785" y="602">Field Readiness</text>
    <text x="955" y="602">Cost Burden</text>
  </g>
  <g font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">
    <text x="275" y="388">50</text>
    <text x="445" y="288">75</text>
    <text x="615" y="328">65</text>
    <text x="785" y="248">85</text>
    <text x="955" y="368">55</text>
  </g>

  <rect x="88" y="644" width="1024" height="40" rx="14" fill="#ffffff" stroke="#d2e2ed"/>
  <text x="112" y="670" font-size="18" fill="#42586d">MALT original chart · Suggested reading order: generalization → reproducibility → field readiness → raw score.</text>
</svg>
