<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MALT Lab Validation Loop</title>
  <desc id="desc">Original diagram showing the experiment lab workflow from paper claim to field decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f6fbff"/>
      <stop offset="100%" stop-color="#ebf5f8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5fafc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0b8b95"/>
      <stop offset="100%" stop-color="#1f5fd6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#244b73" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <text x="90" y="96" font-size="38" font-weight="800" fill="#10253a">MALT Experiment Lab Workflow</text>
  <text x="90" y="134" font-size="21" fill="#54697f">Paper claim to reproduction, stress test, and field decision in one view.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="190" width="220" height="170" rx="24" fill="url(#card)" stroke="#c9dcea"/>
    <rect x="350" y="190" width="220" height="170" rx="24" fill="url(#card)" stroke="#c9dcea"/>
    <rect x="610" y="190" width="220" height="170" rx="24" fill="url(#card)" stroke="#c9dcea"/>
    <rect x="870" y="190" width="220" height="170" rx="24" fill="url(#card)" stroke="#c9dcea"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="118" y="232" font-size="15" font-weight="700" fill="#1f5fd6">STEP 1</text>
    <text x="118" y="270" font-size="30" font-weight="800" fill="#10253a">Claim Split</text>
    <text x="118" y="310" font-size="18" fill="#54697f">Paper promise, dataset,</text>
    <text x="118" y="336" font-size="18" fill="#54697f">and metric framing</text>

    <text x="378" y="232" font-size="15" font-weight="700" fill="#1f5fd6">STEP 2</text>
    <text x="378" y="270" font-size="30" font-weight="800" fill="#10253a">Reproduction</text>
    <text x="378" y="310" font-size="18" fill="#54697f">Check split rules,</text>
    <text x="378" y="336" font-size="18" fill="#54697f">baseline, and leakage</text>

    <text x="638" y="232" font-size="15" font-weight="700" fill="#1f5fd6">STEP 3</text>
    <text x="638" y="270" font-size="30" font-weight="800" fill="#10253a">Stress Check</text>
    <text x="638" y="310" font-size="18" fill="#54697f">Speed shift, noise,</text>
    <text x="638" y="336" font-size="18" fill="#54697f">label scarcity, transfer</text>

    <text x="898" y="232" font-size="15" font-weight="700" fill="#1f5fd6">STEP 4</text>
    <text x="898" y="270" font-size="30" font-weight="800" fill="#10253a">Field Decision</text>
    <text x="898" y="310" font-size="18" fill="#54697f">Deploy now, pilot,</text>
    <text x="898" y="336" font-size="18" fill="#54697f">or hold for more tests</text>
  </g>

  <path d="M310 275 H350" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
  <path d="M570 275 H610" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
  <path d="M830 275 H870" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
  <path d="M978 385 C978 520 260 520 260 390" fill="none" stroke="#7eb6c0" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 14"/>
  <text x="466" y="560" font-size="24" font-weight="700" fill="#0b8b95">Iterate until operationally trustworthy</text>

  <g>
    <rect x="90" y="600" width="1020" height="64" rx="18" fill="#ffffff" stroke="#d2e2ed"/>
    <text x="122" y="640" font-size="18" fill="#42586d">MALT original diagram · Use this loop to turn “good paper” into “credible operating evidence”.</text>
  </g>
</svg>
