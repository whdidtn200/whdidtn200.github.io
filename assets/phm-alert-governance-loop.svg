<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PHM alert governance lifecycle</title>
  <desc id="desc">A six-stage lifecycle from signal observation through closure and baseline feedback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef7f8"/><stop offset="1" stop-color="#f7f3ea"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#087f8c"/><stop offset="1" stop-color="#d47a3b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1b4050" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <text x="70" y="70" font-family="Avenir Next, sans-serif" font-size="34" font-weight="700" fill="#102b39">PHM alert governance lifecycle</text>
  <text x="70" y="108" font-family="Avenir Next, sans-serif" font-size="17" fill="#526a7f">A model score becomes operational value only after ownership, evidence, action, and closure are recorded.</text>
  <path d="M130 280 H1070" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Avenir Next, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(150 280)"><circle r="66" fill="#ffffff" stroke="#087f8c" stroke-width="4"/><text y="-8" font-size="17" font-weight="700" fill="#102b39">OBSERVE</text><text y="18" font-size="13" fill="#5b7184">signal + context</text></g>
    <g transform="translate(330 280)"><circle r="66" fill="#ffffff" stroke="#2d9095" stroke-width="4"/><text y="-8" font-size="17" font-weight="700" fill="#102b39">QUALIFY</text><text y="18" font-size="13" fill="#5b7184">persistence check</text></g>
    <g transform="translate(510 280)"><circle r="66" fill="#ffffff" stroke="#69998b" stroke-width="4"/><text y="-8" font-size="17" font-weight="700" fill="#102b39">TRIAGE</text><text y="18" font-size="13" fill="#5b7184">risk + owner</text></g>
    <g transform="translate(690 280)"><circle r="66" fill="#ffffff" stroke="#a58f65" stroke-width="4"/><text y="-8" font-size="17" font-weight="700" fill="#102b39">INSPECT</text><text y="18" font-size="13" fill="#5b7184">field evidence</text></g>
    <g transform="translate(870 280)"><circle r="66" fill="#ffffff" stroke="#c9854d" stroke-width="4"/><text y="-8" font-size="17" font-weight="700" fill="#102b39">ACT</text><text y="18" font-size="13" fill="#5b7184">work order</text></g>
    <g transform="translate(1050 280)"><circle r="66" fill="#ffffff" stroke="#d47a3b" stroke-width="4"/><text y="-8" font-size="17" font-weight="700" fill="#102b39">CLOSE</text><text y="18" font-size="13" fill="#5b7184">label + feedback</text></g>
  </g>
  <path d="M1050 368 C1050 460 150 460 150 368" fill="none" stroke="#7c93a2" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c93a2"/></marker></defs>
  <text x="600" y="452" font-family="Avenir Next, sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#465f72">Inspection result and maintenance outcome return to the baseline and model review queue</text>
  <text x="70" y="495" font-family="Avenir Next, sans-serif" font-size="13" fill="#60768a">MALT original operational diagram · 2026-07-17</text>
</svg>
